# Review against the effective port-80 default vhost before applying.
log_format uedt_signed '$remote_addr $status $server_port $uri $sent_http_content_range';
map $uri $uedt_legacy_cache_control {
    default "";
    ~\.(json|sig)$ no-store;
}
server {
    listen 80 default_server;
    server_name _;
    root /dt/ue-dt-updates;
    add_header Cache-Control $uedt_legacy_cache_control always;
    disable_symlinks on from=$document_root;

    location ~ /\. { return 404; }

    # The compatibility link is the document root itself. Links below it are denied.
    location ~ ^/catalogs/developer/ {
        auth_basic "Developer updates";
        auth_basic_user_file /dt/ue-dt-updates/.htpasswd-developer;
        try_files $uri =404;
    }
    location ~ ^/projects/[^/]+/dev/ {
        auth_basic "Developer updates";
        auth_basic_user_file /dt/ue-dt-updates/.htpasswd-developer;
        try_files $uri =404;
    }
    location ~ ^/(catalogs/general/|projects/[^/]+/prod/stable/) {
        try_files $uri =404;
    }

    location = /api/v1/auth/challenge {
        include /etc/nginx/uedt-signed-proxy.inc;
    }
    location = /api/v1/catalog {
        include /etc/nginx/uedt-signed-proxy.inc;
    }
    location ^~ /releases/ {
        include /etc/nginx/uedt-signed-proxy.inc;
    }
    location / { return 404; }
}
