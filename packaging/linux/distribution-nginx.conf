# Included in http{}; replace TLS paths and server_name for your deployment.
server {
    listen 443 ssl;
    server_name updates.example.com;
    ssl_certificate /etc/pki/tls/certs/ue-dt.crt;
    ssl_certificate_key /etc/pki/tls/private/ue-dt.key;
    location = /api/v1/catalog {
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header X-Distribution-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization $http_authorization;
        proxy_cache off;
    }
    location = /_distribution_auth {
        internal;
        proxy_pass http://127.0.0.1:18500/internal/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Distribution-Client-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location ^~ /releases/ {
        auth_request /_distribution_auth;
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header X-Distribution-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_cache off;
    }
    location / { return 404; }
}
