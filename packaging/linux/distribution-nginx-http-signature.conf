# Explicit intranet HTTP profile: traffic is NOT encrypted.
# backend server.json authenticationMode=request-signature-v1 and PublicUrl must match.
# Include in http{}. Replace the example address; firewall port 18500 from remote hosts.
server {
    listen 80;
    server_name 10.20.30.40;
    client_max_body_size 1k;
    location ~ ^/(api/v1/(auth/challenge|catalog)|releases/) {
        # Backend authorizes every request once. No auth_request and no static alias/root.
        proxy_pass http://127.0.0.1:18500;
        proxy_set_header Host $http_host;
        proxy_set_header X-Distribution-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Original-URI "";
        proxy_set_header Authorization "";
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
