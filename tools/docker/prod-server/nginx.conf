user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    log_format uedt '$remote_addr $status $server_port $uri $sent_http_content_range';

    # Based on packaging/linux/distribution-nginx-http-signature.conf.
    # Backend is loopback-only. Clients must sign the configured public origin.
    server {
        listen 80;
        listen 18080;
        server_name host.docker.internal;
        client_max_body_size 1k;
        access_log /var/log/nginx/ue-dt-access.log uedt;
        gzip off;
        send_timeout 3600s;

        location ~ ^/(api/v1/(auth/challenge|catalog)|releases/) {
            proxy_pass http://127.0.0.1:18500;
            proxy_set_header Host $http_host;
            proxy_set_header X-Distribution-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-URI "";
            proxy_set_header Authorization "";
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location / { return 404; }
    }
}
