name: build

on:
  push:
    branches:
      - main
      - feature/**
      - claude/**
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore UeDtLauncher.sln

      - name: Build
        run: dotnet build UeDtLauncher.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/UeDtLauncher.Tests/UeDtLauncher.Tests.csproj -c Release --no-build

      - name: Publish Windows
        if: runner.os == 'Windows'
        run: dotnet publish src/UeDtLauncher/UeDtLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - name: Publish Windows Agent
        if: runner.os == 'Windows'
        run: dotnet publish src/UeDtLauncher.Agent/UeDtLauncher.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/agent-win-x64

      - name: Publish Linux
        if: runner.os == 'Linux'
        run: dotnet publish src/UeDtLauncher/UeDtLauncher.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/linux-x64

      - name: Publish Linux Agent
        if: runner.os == 'Linux'
        run: dotnet publish src/UeDtLauncher.Agent/UeDtLauncher.Agent.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o publish/agent-linux-x64

      - name: Publish Distribution Server
        if: runner.os == 'Linux'
        run: dotnet publish src/UeDtLauncher.DistributionServer -c Release -r linux-x64 --self-contained true -o publish/distribution-server

      - name: Install isolated distribution E2E prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx zip unzip openssl curl

      - name: Signed HTTPS distribution end to end
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash tools/test-distribution-e2e.sh publish/distribution-server/UeDtLauncher.DistributionServer publish/linux-x64/UeDtLauncher /usr/sbin/nginx
        # Functional gate only. Shared-runner wall times are not a performance acceptance gate.
        # Do not upload the temporary server root: it contains test keys and credentials.

      - name: Signed intranet HTTP and managed Agent end to end
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: python3 tools/test-intranet-auth.py --server publish/distribution-server/UeDtLauncher.DistributionServer --launcher publish/linux-x64/UeDtLauncher --agent publish/agent-linux-x64/UeDtLauncher.Agent --nginx /usr/sbin/nginx --service-proof
        # Functional only; test keys and private roots must never become public CI artifacts.

      - name: Runtime descendant and managed broker proof
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tools/test-runtime-family.py --launcher publish/win-x64/UeDtLauncher.exe
            python tools/test-runtime-broker.py --launcher publish/win-x64/UeDtLauncher.exe --agent publish/agent-win-x64/UeDtLauncher.Agent.exe
          else
            python3 tools/test-runtime-family.py --launcher publish/linux-x64/UeDtLauncher
            python3 tools/test-runtime-broker.py --launcher publish/linux-x64/UeDtLauncher --agent publish/agent-linux-x64/UeDtLauncher.Agent
          fi

      - name: Windows packaging failure gates
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/test-windows-packaging.ps1

      - name: Runtime safety persistence and service proof
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            rid=win-x64; suffix=.exe; py=python
          else
            rid=linux-x64; suffix=; py=python3
          fi
          dotnet publish tools/RuntimeFaultHarness -c Release -r "$rid" --self-contained true -p:PublishSingleFile=true -o publish/fault-harness
          "$py" tools/test-runtime-crash-boundaries.py --harness "publish/fault-harness/UeDtLauncher.RuntimeFaultHarness$suffix" --launcher "publish/$rid/UeDtLauncher$suffix"
          "$py" tools/test-runtime-validation.py --launcher "publish/$rid/UeDtLauncher$suffix"
          "$py" tools/test-migration-safety.py --launcher "publish/$rid/UeDtLauncher$suffix" --agent "publish/agent-$rid/UeDtLauncher.Agent$suffix"
          "$py" tools/test-service-runtime.py --launcher "publish/$rid/UeDtLauncher$suffix"
          "$py" tools/test-agent-service-target.py --agent "publish/agent-$rid/UeDtLauncher.Agent$suffix"
          "$py" tools/check-improvement-ledger.py
        # Test-only harness/temporary roots are never release artifacts; no keys or raw logs uploaded.
