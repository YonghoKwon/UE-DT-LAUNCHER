name: signed-release

on:
  push:
    tags: ['launcher-v*']

permissions:
  contents: read

jobs:
  functional-gate:
    uses: ./.github/workflows/build.yml

  verify-signing-gate:
    runs-on: windows-latest
    steps:
      - name: Require production code-signing credentials
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw 'Stable release is blocked: Windows Authenticode credentials are not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RPM_GPG_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:RPM_GPG_KEY_ID)) {
            throw 'Stable release is blocked: RPM signing credentials are not configured.'
          }

  windows-package:
    needs: [verify-signing-gate, functional-gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Resolve version
        shell: pwsh
        run: '"VERSION=$($env:GITHUB_REF_NAME -replace ''^launcher-v'','''')" | Out-File $env:GITHUB_ENV -Append'
      - name: Import signing certificate
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP signing.pfx
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_PFX))
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force)
          "UE_DT_SIGNING_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append
      - name: Build MSI payload
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version $env:VERSION -OfficialBuild
      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools Microsoft.Sbom.DotNetTool --version 4.1.5
          ./.tools/sbom-tool generate -b $env:UE_DT_PACKAGE_DIR -bc . -pn UeDtLauncher -pv $env:VERSION -ps UE-DT -nsb https://ue-dt.local/sbom
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem $env:UE_DT_PACKAGE_DIR -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path)" } | Set-Content (Join-Path $env:UE_DT_PACKAGE_DIR SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ue-dt-launcher-windows-${{ env.VERSION }}
          path: ${{ env.UE_DT_PACKAGE_DIR }}

  linux-package:
    needs: [verify-signing-gate, functional-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#launcher-v}" >> "$GITHUB_ENV"
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: chmod +x scripts/build-rpm.sh && ./scripts/build-rpm.sh "$VERSION"
      - name: Sign and verify RPM
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
          RPM_GPG_KEY_ID: ${{ secrets.RPM_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          [[ "$RPM_GPG_KEY_ID" =~ ^[A-Fa-f0-9]{40}$ ]] || { echo 'An exact primary signing fingerprint is required'; exit 1; }
          export GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/rpm-sign.XXXXXXXX")
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          actual=$(gpg --with-colons --list-secret-keys "$RPM_GPG_KEY_ID" | awk -F: '$1=="fpr" {print $10; exit}')
          test "${actual^^}" = "${RPM_GPG_KEY_ID^^}"
          test -f "$UE_DT_RPM_PATH"
          rpmsign --define "_gpg_name $actual" --define "_gpg_path $GNUPGHOME" --define '__gpg /usr/bin/gpg' --addsign "$UE_DT_RPM_PATH"
          gpg --batch --export "$actual" > "$GNUPGHOME/public.gpg"
          mkdir "$GNUPGHOME/rpmdb"
          rpm --define "_dbpath $GNUPGHOME/rpmdb" --import "$GNUPGHOME/public.gpg"
          rpm --define "_dbpath $GNUPGHOME/rpmdb" --checksig --verbose "$UE_DT_RPM_PATH" > "$GNUPGHOME/verification.txt"
          ! grep -Eq 'NOKEY|NOT OK|BAD' "$GNUPGHOME/verification.txt"
          grep -Ei 'signature.*: OK' "$GNUPGHOME/verification.txt"
          python3 tools/verify-rpm-payload.py --rpm "$UE_DT_RPM_PATH" --payload "${UE_DT_RPM_PACKAGE_DIR%/artifacts}/ue-dt-launcher-$VERSION" --version "$VERSION" --output "$UE_DT_RPM_PACKAGE_DIR/package-result.json"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["UE_DT_RPM_PACKAGE_DIR"])/"package-result.json"; d=json.loads(p.read_text()); d.update(classification="SIGNED-RELEASE",signerFingerprint=os.environ["RPM_GPG_KEY_ID"],functionalGateSource=os.environ["GITHUB_SHA"]); p.write_text(json.dumps(d,indent=2))'
      - name: Generate SBOM
        run: |
          dotnet tool install --tool-path .tools Microsoft.Sbom.DotNetTool --version 4.1.5
          ./.tools/sbom-tool generate -b "$UE_DT_RPM_PACKAGE_DIR" -bc . -pn UeDtLauncher -pv "$VERSION" -ps UE-DT -nsb https://ue-dt.local/sbom
      - name: Generate checksum
        run: cd "$UE_DT_RPM_PACKAGE_DIR" && sha256sum "$(basename "$UE_DT_RPM_PATH")" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ue-dt-launcher-linux-${{ env.VERSION }}
          path: ${{ env.UE_DT_RPM_PACKAGE_DIR }}
